name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: freebuff-bionic-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Build inside Termux aarch64
        run: bash termux/ci/build-on-runner.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebuff-termux-aarch64
          path: |
            freebuff-out/*.deb
            freebuff-out/*.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            freebuff-out/*.deb freebuff-out/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Native Freebuff build for Termux/Android aarch64. See the README for install and verification steps." \
            --verify-tag
